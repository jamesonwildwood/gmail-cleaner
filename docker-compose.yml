# Hardened compose for a home Docker host behind a Caddy reverse proxy.
#
# - Builds the image from this checkout (no auto-pull of a third-party :latest).
# - The web UI (8766) is NOT published on the LAN. It is reachable only through
#   Caddy on the shared docker network, where Caddy enforces HTTPS + basic_auth.
# - The OAuth callback (8767) is bound to loopback only. Do the one-time sign-in
#   from your laptop over an SSH tunnel:  ssh -L 8767:127.0.0.1:8767 user@host
#   and keep the Google redirect URI at http://localhost:8767/
#
# Upstream's original compose (pulls ghcr.io/gururagavendra/gmail-cleaner:latest
# and publishes both ports on 0.0.0.0) is in git history if you need it.

services:
  gmail-cleaner:
    build: .
    image: gmail-cleaner:local
    pull_policy: never

    ports:
      - "127.0.0.1:8767:8767"  # OAuth callback, loopback only (reach via SSH tunnel)

    networks:
      - proxy                  # Caddy reaches the UI at gmail-cleaner:8766 on this network

    volumes:
      - type: bind
        source: ./credentials.json
        target: /app/credentials.json
        read_only: true
        bind:
          create_host_path: false
      # token.json is written to /app/data and persisted here across restarts
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: true

    # Run as the host user that owns ./credentials.json and ./data, not root.
    # With cap_drop: ALL, root cannot bypass file permissions on bind mounts,
    # and this also leaves token.json owned by you instead of root.
    # Override if your uid/gid differ:  PUID=1001 PGID=1001 docker compose up -d
    user: "${PUID:-1000}:${PGID:-1000}"

    environment:
      - WEB_AUTH=true
      # The image's virtualenv was built by root; skip uv's startup re-sync so a
      # non-root user does not need write access to /app/.venv.
      - UV_NO_SYNC=1
      # OAUTH_HOST / OAUTH_EXTERNAL_PORT intentionally unset: redirect stays http://localhost:8767/

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    restart: unless-stopped

networks:
  proxy:
    external: true
    # Name of the docker network your Caddy container is attached to.
    # Override without editing this file:  PROXY_NETWORK=mynet docker compose up -d
    name: ${PROXY_NETWORK:-wiki_default}
